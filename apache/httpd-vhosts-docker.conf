<VirtualHost *:80>
	DocumentRoot "/var/www/html/theme/www"
	ServerName kbhff.local

	AddType application/x-httpd-php .php

	<Directory "/var/www/html/theme">
		Options MultiViews
		AcceptPathInfo On
		ErrorDocument 404 /janitor/admin/404.php

		Require all granted
	</Directory>

	<Directory "/var/www/html/submodules/janitor/src/www">
		Options MultiViews
		AcceptPathInfo On
		ErrorDocument 404 /janitor/admin/404.php

		Require all granted
	</Directory>

	# set custom log for individual log files
	CustomLog /proc/self/fd/1 combined
	ErrorLog /proc/self/fd/2

	# include path for php
	SetEnv "LOCAL_PATH" "/var/www/html/theme"
	SetEnv "FRAMEWORK_PATH" "/var/www/html/submodules/janitor/src"

	# reference to backend interface
	Alias "/janitor/admin" "/var/www/html/submodules/janitor/src/www"

	# setup janitor autoconversion
	Alias "/images" "/var/www/html/theme/library/public"
	Alias "/videos" "/var/www/html/theme/library/public"
	Alias "/audios" "/var/www/html/theme/library/public"
	<Directory "/var/www/html/theme/library/public">
		ErrorDocument 404 /janitor/admin/autoconversion
	</Directory>

	# setup asset-builder
	Alias "/asset-builder" "/var/www/html/submodules/asset-builder"

</VirtualHost>
